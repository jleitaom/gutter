name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build app
        run: ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Gutter.app
          path: build/Gutter.app
