name: Release

# Push a tag like v0.1.0 to build, package and publish a GitHub release.
# Every file gets a SHA-256 checksum and a signed build provenance attestation,
# so anyone can verify a download was built by this workflow from this repo:
#   gh attestation verify Gutter-0.1.0.dmg --repo jleitaom/gutter
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # build.sh numbers builds by commit count

      - name: Package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"

      # Free attestations are only available for public repositories.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true
